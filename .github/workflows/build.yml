name: Build Project

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes do gerador de cardápio
        run: npx vitest run src/lib/event-menu.test.ts

      - name: Testar foto de nota fiscal como compra na GIA
        run: npx vitest run tests/goat-ai-controladoria-receipt.test.ts -t "foto ignora modalidade inferida pela IA|foto de nota fiscal sem fornecedor ou pagamento|modelo Gemini de visão"

      - name: Testar resiliência do modelo de visão
        run: npx vitest run tests/goat-ai-router.test.ts -t "Gemini troca 3.8 por 3.7|falha total de visão"

      - name: Testar despesas pagas e em aberto pela GIA
        run: npx vitest run tests/goat-ai-controladoria-receipt.test.ts -t "lê linguagem natural de pago versus em aberto|despesa pendente não exige forma de pagamento|mão de obra ainda não paga vira Pendente|continuação 'pessoal Romulo Chaves|follow-up separa itens pagos de mão de obra Em aberto"

      - name: Build do projeto
        run: npm run build
