name: Build Project

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes do gerador de cardápio
        run: npx vitest run src/lib/event-menu.test.ts

      - name: Testar foto de nota fiscal como compra na GIA
        run: npx vitest run tests/goat-ai-controladoria-receipt.test.ts -t "foto sem legenda de nota fiscal|nota fiscal sem forma de pagamento"

      - name: Build do projeto
        run: npm run build
