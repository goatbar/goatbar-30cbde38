name: Vercel Inspect Diagnostic

on:
  push:
    branches:
      - diagnostic/vercel-inspect-20261002

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credencial da Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not configured in this repository"
            exit 2
          fi

      - name: Inspecionar logs do deployment que falhou
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest inspect dpl_Gh7oyTm3zX2eK6DqCaWHCXpfMiGE --logs --scope goatbars-projects --token "$VERCEL_TOKEN"
